name: MobileROS CI

on:
  push:
  pull_request:

jobs:
  build-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run legacy namespace check
        run: ci-scripts/check_legacy_namespace.sh
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential python3
      - name: Configure (ENABLE_OAI=OFF)
        run: cmake -S . -B build -DENABLE_OAI=OFF
      - name: Build
        run: cmake --build build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f docker/Dockerfile .
